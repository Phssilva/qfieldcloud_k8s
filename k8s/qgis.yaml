apiVersion: apps/v1
kind: Deployment
metadata:
  name: qfieldcloud-qgis
  namespace: qfieldcloud
spec:
  replicas: 2
  selector:
    matchLabels:
      app: qfieldcloud-qgis
  template:
    metadata:
      labels:
        app: qfieldcloud-qgis
    spec:
      containers:
      - name: qgis
        image: ${ACR_NAME}.azurecr.io/qfieldcloud-qgis:latest
        imagePullPolicy: Always
        command: ["tail", "-f", "/dev/null"]
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        volumeMounts:
        - name: transformation-grids
          mountPath: /transformation_grids
      volumes:
      - name: transformation-grids
        persistentVolumeClaim:
          claimName: qfieldcloud-transformation-grids-pvc
