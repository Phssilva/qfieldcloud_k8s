apiVersion: v1
kind: Secret
metadata:
  name: qfieldcloud-secrets
  namespace: qfieldcloud
type: Opaque
stringData:
  SECRET_KEY: "change-me-to-a-secure-random-string"
  POSTGRES_DB: "qfieldcloud"
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "change-me-to-secure-password"
  POSTGRES_HOST: "qfieldcloud-postgres"
  POSTGRES_PORT: "5432"
  POSTGRES_SSLMODE: "prefer"
  GEODB_HOST: "qfieldcloud-postgres"
  GEODB_PORT: "5432"
  GEODB_USER: "postgres"
  GEODB_PASSWORD: "change-me-to-secure-password"
  GEODB_DB: "qfieldcloud"
  STORAGE_ACCESS_KEY_ID: "change-me"
  STORAGE_SECRET_ACCESS_KEY: "change-me"
  STORAGE_BUCKET_NAME: "qfieldcloud"
  STORAGE_REGION_NAME: "eastus"
  STORAGE_ENDPOINT_URL: ""
  EMAIL_HOST: "smtp.example.com"
  EMAIL_HOST_USER: "user@example.com"
  EMAIL_HOST_PASSWORD: "change-me"
  DEFAULT_FROM_EMAIL: "noreply@example.com"
  SENTRY_DSN: ""
  SENTRY_RELEASE: ""
  SENTRY_SAMPLE_RATE: "0.1"
