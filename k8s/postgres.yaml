apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: qfieldcloud-postgres
  namespace: qfieldcloud
spec:
  serviceName: qfieldcloud-postgres
  replicas: 1
  selector:
    matchLabels:
      app: qfieldcloud-postgres
  template:
    metadata:
      labels:
        app: qfieldcloud-postgres
    spec:
      containers:
      - name: postgres
        image: postgis/postgis:14-3.3
        ports:
        - containerPort: 5432
          name: postgres
        env:
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: qfieldcloud-secrets
              key: POSTGRES_DB
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: qfieldcloud-secrets
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: qfieldcloud-secrets
              key: POSTGRES_PASSWORD
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
  volumeClaimTemplates:
  - metadata:
      name: postgres-data
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: managed-premium
      resources:
        requests:
          storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: qfieldcloud-postgres
  namespace: qfieldcloud
spec:
  selector:
    app: qfieldcloud-postgres
  ports:
  - port: 5432
    targetPort: 5432
  clusterIP: None
